[package]
name = "athar-app"
version = "2.1.0"
edition = "2024"

[dependencies]
athar-core = { version = "0.1.0", path = "../core" }
chrono = "0.4.45"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
hound = "3.5.1"
md-5 = "0.11.0"
mp3lame-encoder = "0.3.0"
notify = "8.2.2"
rayon = "1.12.0"
realfft = "3.5.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
trash = "5.3.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
