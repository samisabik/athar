[project]
name = "athar"
dynamic = ["version"]
description = "Search local audio by how it sounds, using CLAP embeddings"
requires-python = ">=3.11,<3.14"
dependencies = [
    "onnxruntime",
    "tokenizers",
    "librosa",
    "soundfile",
    "numpy",
    "fastapi>=0.162",
    "uvicorn",
    "python-multipart",
    "pywebview",
    "pyobjc-framework-Cocoa",
    "watchdog>=7.1.0",
]

[project.scripts]
athar = "athar.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "athar/__init__.py"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "torch",
    "transformers",
    "onnx",
    "pytest>=9.2.0",
    "httpx>=0.28.1",
]
